services:
  web:
    build: .
    # Ejecuta migraciones y collectstatic antes de levantar Gunicorn
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn memory_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    depends_on:
      - db
    # Mantener servicio no expuesto públicamente; Nginx hará proxy a :8000
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-memory_game_db}
      - POSTGRES_USER=${POSTGRES_USER:-memory_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memory_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # En VPS, no expongas Postgres públicamente
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
