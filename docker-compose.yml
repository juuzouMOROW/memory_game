services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - POSTGRES_DB=memory_game_db
      - POSTGRES_USER=memory_user
      - POSTGRES_PASSWORD=memory_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=memory_game_db
      - POSTGRES_USER=memory_user
      - POSTGRES_PASSWORD=memory_password
    ports:
      - "5432:5432"

volumes:
  postgres_data: