<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'memory_game/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-5">
                    <!-- Header -->
                    <div class="text-center mb-5">
                        <div class="brand-logo">
                            <i class="fas fa-brain"></i>
                        </div>
                        <h2 class="text-white fw-bold mb-2">Memory Game</h2>
                        <p class="text-light opacity-75">Inicia sesión en tu cuenta</p>
                    </div>

                    <!-- Mensajes -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                {{ message }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Formulario -->
                    <form method="post" id="loginForm">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label text-white mb-3">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-user text-light opacity-75"></i>
                                </span>
                                <input type="text" class="form-control border-start-0" name="username" 
                                       placeholder="Ingresa tu usuario" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-white mb-3">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <i class="fas fa-lock text-light opacity-75"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" name="password" 
                                       placeholder="Ingresa tu contraseña" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom text-white w-100 py-3 mb-4">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="text-light opacity-75 mb-0">
                            ¿No tienes cuenta? 
                            <a href="{% url 'register' %}" class="text-white text-decoration-none fw-semibold">
                                Regístrate aquí
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
