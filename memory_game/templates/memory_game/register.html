<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'memory_game/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <!-- MÁS ANCHO: cambiamos de col-md-6 a col-md-8 y col-lg-6 -->
            <div class="col-md-8 col-lg-6">
                <div class="glass-card p-5">
                    <!-- Header -->
                    <div class="text-center mb-5">
                        <div class="brand-logo">
                            <i class="fas fa-brain"></i>
                        </div>
                        <h1 class="text-white fw-bold mb-2 display-6">Memory Game</h1>
                        <p class="text-light opacity-75 lead">Crea tu cuenta gratuita</p>
                    </div>

                    <!-- Mensajes -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                                <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %} me-2"></i>
                                {{ message }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Formulario -->
                    <form method="post" id="registerForm">
                        {% csrf_token %}
                        
                        <div class="row">
                            <!-- Usuario - Ocupa toda la fila -->
                            <div class="col-12">
                                <div class="mb-4">
                                    <label class="form-label text-white mb-3">
                                        <i class="fas fa-user me-2"></i>Nombre de Usuario
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0">
                                            <i class="fas fa-user text-light opacity-75"></i>
                                        </span>
                                        <input type="text" class="form-control border-start-0" name="username" 
                                               placeholder="Ej: jugador123" required>
                                    </div>
                                    <div class="form-text text-light opacity-75 mt-2">
                                        <i class="fas fa-info-circle me-1"></i>Mínimo 3 caracteres, solo letras y números
                                    </div>
                                </div>
                            </div>

                            <!-- Email - Ocupa toda la fila -->
                            <div class="col-12">
                                <div class="mb-4">
                                    <label class="form-label text-white mb-3">
                                        <i class="fas fa-envelope me-2"></i>Correo Electrónico (Opcional)
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0">
                                            <i class="fas fa-envelope text-light opacity-75"></i>
                                        </span>
                                        <input type="email" class="form-control border-start-0" name="email" 
                                               placeholder="tu@email.com">
                                    </div>
                                </div>
                            </div>

                            <!-- Contraseñas en 2 columnas en pantallas grandes -->
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-white mb-3">
                                        <i class="fas fa-lock me-2"></i>Contraseña
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0">
                                            <i class="fas fa-lock text-light opacity-75"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0" name="password1" 
                                               id="password1" placeholder="Crea una contraseña segura" required>
                                    </div>
                                    <div class="password-strength" id="passwordStrength"></div>
                                    <div class="form-text text-light opacity-75 mt-2">
                                        <i class="fas fa-shield-alt me-1"></i>Mínimo 6 caracteres
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label text-white mb-3">
                                        <i class="fas fa-lock me-2"></i>Confirmar Contraseña
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent border-end-0">
                                            <i class="fas fa-lock text-light opacity-75"></i>
                                        </span>
                                        <input type="password" class="form-control border-start-0" name="password2" 
                                               id="password2" placeholder="Repite tu contraseña" required>
                                    </div>
                                    <div class="form-text mt-2" id="passwordMatch">
                                        <i class="fas fa-sync me-1"></i>Las contraseñas deben coincidir
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom text-white w-100 py-3 mb-4 mt-2">
                            <i class="fas fa-user-plus me-2"></i>
                            Crear Cuenta Gratis
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top border-light border-opacity-25">
                        <p class="text-light opacity-75 mb-0">
                            ¿Ya tienes cuenta? 
                            <a href="{% url 'login' %}" class="text-white text-decoration-none fw-semibold">
                                Inicia sesión aquí
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const password1 = document.getElementById('password1');
            const password2 = document.getElementById('password2');
            const passwordStrength = document.getElementById('passwordStrength');
            const passwordMatch = document.getElementById('passwordMatch');

            // Validar fortaleza de contraseña
            password1.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                if (password.length >= 6) strength += 25;
                if (/[A-Z]/.test(password)) strength += 25;
                if (/[0-9]/.test(password)) strength += 25;
                if (/[^A-Za-z0-9]/.test(password)) strength += 25;
                
                passwordStrength.style.width = strength + '%';
                
                if (strength < 50) {
                    passwordStrength.style.background = '#ef4444';
                } else if (strength < 75) {
                    passwordStrength.style.background = '#f59e0b';
                } else {
                    passwordStrength.style.background = '#10b981';
                }
            });

            // Validar que las contraseñas coincidan
            password2.addEventListener('input', function() {
                if (password1.value !== password2.value) {
                    passwordMatch.innerHTML = '<i class="fas fa-times me-1"></i>Las contraseñas no coinciden';
                    passwordMatch.style.color = '#ef4444';
                } else if (password2.value.length > 0) {
                    passwordMatch.innerHTML = '<i class="fas fa-check me-1"></i>Las contraseñas coinciden';
                    passwordMatch.style.color = '#10b981';
                } else {
                    passwordMatch.innerHTML = '<i class="fas fa-sync me-1"></i>Las contraseñas deben coincidir';
                    passwordMatch.style.color = 'rgba(255, 255, 255, 0.75)';
                }
            });

            // Validación suave
            registerForm.addEventListener('submit', function(e) {
                const username = document.querySelector('input[name="username"]').value;
                const pass1 = password1.value;
                const pass2 = password2.value;
                
                let hasErrors = false;
                
                if (username.length < 3) {
                    alert('El usuario debe tener al menos 3 caracteres');
                    hasErrors = true;
                }
                
                if (pass1.length < 6) {
                    alert('La contraseña debe tener al menos 6 caracteres');
                    hasErrors = true;
                }
                
                if (pass1 !== pass2) {
                    alert('Las contraseñas no coinciden');
                    hasErrors = true;
                }
                
                if (hasErrors) {
                    e.preventDefault();
                } else {
                    const btn = this.querySelector('button[type="submit"]');
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creando cuenta...';
                    btn.disabled = true;
                }
            });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
